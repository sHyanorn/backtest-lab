[project]
name = "backtest-lab"
version = "0.1.0"
description = "Backtesting platform that tests whether a strategy is overfit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.162.2",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "yfinance==1.8.0",
]

[dependency-groups]
dev = [
    "empyrical-reloaded==0.7.2",
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PD", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers"
markers = ["network: needs internet access; deselected by default"]

[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["empyrical"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
